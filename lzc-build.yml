manifest: ./lzc-manifest.yml
contentdir: ./content
pkgout: ./dist
icon: ./icon.png
buildscript: |
  set -eu
  rm -rf content dist
  mkdir -p content/lazycat-injects dist
  cp scripts/lzc-file-chooser-inject.js content/lazycat-injects/lzc-file-chooser-inject.js
  # 只使用 Action 注入的 LAZYCAT_VERSION，避免构建工具对普通 shell 变量做预展开。
  curl -fsSL --retry 3 -o /tmp/kanzo-x86_64-unknown-linux-musl.tar.xz "https://github.com/emanuele-em/kanzo/releases/download/v${LAZYCAT_VERSION}/kanzo-x86_64-unknown-linux-musl.tar.xz"
  curl -fsSL --retry 3 -o /tmp/kanzo-x86_64-unknown-linux-musl.tar.xz.sha256 "https://github.com/emanuele-em/kanzo/releases/download/v${LAZYCAT_VERSION}/kanzo-x86_64-unknown-linux-musl.tar.xz.sha256"
  cd /tmp
  sha256sum -c kanzo-x86_64-unknown-linux-musl.tar.xz.sha256
  tar -xJf kanzo-x86_64-unknown-linux-musl.tar.xz
  cd - >/dev/null
  cp /tmp/kanzo-x86_64-unknown-linux-musl/kanzo content/kanzo
  chmod +x content/kanzo
  ./content/kanzo --version
